<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha despensa</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #203329;
      background: #eef2ed;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --verde: #244b37;
      --verde-claro: #e8f0e9;
      --texto-suave: #6d7a70;
      --borda: #e3e9e3;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2.5rem 1.25rem;
      background: radial-gradient(ellipse at 8% 0%, #dce8dc 0, transparent 34rem), #eef2ed;
    }
    .pagina { max-width: 1080px; margin: 0 auto; }
    .cabecalho {
      position: relative;
      overflow: hidden;
      margin-bottom: 1.25rem;
      padding: 2rem 2.25rem;
      border-radius: 22px;
      background: var(--verde);
      color: #f7faf7;
      box-shadow: 0 16px 40px #20332918;
    }
    .cabecalho::after {
      position: absolute;
      top: -5rem;
      right: -2rem;
      width: 17rem;
      height: 17rem;
      border: 1px solid #ffffff20;
      border-radius: 50%;
      box-shadow: 0 0 0 2rem #ffffff08, 0 0 0 4rem #ffffff05;
      content: "";
    }
    .sobretitulo, .rotulo {
      margin: 0 0 .65rem;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .sobretitulo { color: #c7d9ca; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    .subtitulo { margin: .55rem 0 0; color: #d7e3d9; }
    .conteudo { display: grid; gap: 1.25rem; }
    .painel {
      min-width: 0;
      padding: 1.5rem;
      border: 1px solid #ffffffb8;
      border-radius: 20px;
      background: #ffffffd9;
      box-shadow: 0 12px 32px #2033290c;
    }
    .painel-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .rotulo { color: #718276; }
    h2 { margin: 0; font-size: 1.2rem; letter-spacing: -.02em; }
    .nota { color: var(--texto-suave); font-size: .82rem; }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: .8rem .55rem; border-bottom: 1px solid var(--borda); }
    th { color: var(--texto-suave); font-size: .78rem; font-weight: 650; }
    td { font-size: .92rem; }
    .vazio { padding: 1.5rem .55rem; color: var(--texto-suave); text-align: center; }
    button, input, select { min-height: 2.8rem; font: inherit; }
    button { cursor: pointer; }
    form { display: grid; gap: .9rem; margin-top: 1.2rem; }
    form label { display: grid; gap: .4rem; color: #425449; font-size: .88rem; font-weight: 600; }
    input, select {
      width: 100%;
      padding: .65rem .8rem;
      border: 1px solid #d8e1d9;
      border-radius: 11px;
      outline: none;
      background: #fbfcfa;
      color: #203329;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus { border-color: #6a9275; box-shadow: 0 0 0 3px #6a927526; }
    .botao { min-height: 2.45rem; padding: .45rem .75rem; border: 1px solid transparent; border-radius: 9px; font-size: .82rem; font-weight: 650; }
    .botao-secundario { border-color: #dce5dd; background: #f5f8f5; color: #365542; }
    .botao-secundario:hover { background: var(--verde-claro); }
    .botao-remover { border-color: #f0dddd; background: #fff8f7; color: #9a4c43; }
    .botao-remover:hover { background: #fae9e6; }
    .botao-principal { width: 100%; border-radius: 11px; background: var(--verde); color: white; font-weight: 650; }
    .botao-principal:hover { background: #193d2b; }
    .acoes { white-space: nowrap; }
    .acoes button { margin: .15rem; }
    #aviso:empty { display: none; }
    #aviso { margin: .9rem 0 0; padding: .75rem .85rem; border-radius: 10px; background: var(--verde-claro); color: #355442; font-size: .88rem; }
    @media (min-width: 860px) {
      .conteudo { grid-template-columns: minmax(0, 1.35fr) minmax(290px, .8fr); align-items: start; }
    }
    @media (max-width: 560px) {
      body { padding: 1rem .75rem; }
      .cabecalho { padding: 1.5rem; border-radius: 17px; }
      .cabecalho::after { right: -8rem; }
      .painel { padding: 1.1rem; border-radius: 16px; }
      .painel-topo { display: block; }
      .nota { display: block; margin-top: .4rem; }
      th, td { padding: .65rem .35rem; }
      .acoes { white-space: normal; }
      .acoes button { padding: .4rem .5rem; }
    }
  </style>
</head>
<body>
  <main class="pagina">
    <header class="cabecalho">
      <p class="sobretitulo">Gestão da despensa</p>
      <h1>Minha despensa</h1>
      <p class="subtitulo">Consulte e atualize seus itens em um só lugar.</p>
    </header>

    <div class="conteudo">
      <section class="painel">
        <div class="painel-topo">
          <div>
            <p class="rotulo">Estoque</p>
            <h2>Itens da despensa</h2>
          </div>
          <span class="nota">Sua lista atual</span>
        </div>
        <div class="tabela">
          <table>
            <thead><tr><th>Item</th><th>Quantidade</th><th>Ações</th></tr></thead>
            <tbody id="lista"></tbody>
          </table>
        </div>
      </section>

      <section class="painel">
        <p class="rotulo">Atualização</p>
        <h2>Adicionar item</h2>
        <p class="nota">Informe o produto e a quantidade que tem em casa.</p>
        <form id="form-adicionar">
          <label>Nome <input id="nome" maxlength="100" required></label>
          <label>Quantidade <input id="qtd" type="number" min="0.01" step="any" value="1" required></label>
          <label>Unidade
            <select id="un">
              <option value="unidade">Unidade</option>
              <option value="kg">kg</option><option value="L">L</option>
            </select>
          </label>
          <label>Categoria
            <select id="cat">
              <option>Mercearia</option><option>Laticínios</option><option>Hortifruti</option>
              <option>Limpeza</option><option>Doces e Guloseimas</option><option selected>Outros</option>
            </select>
          </label>
          <button class="botao-principal" type="submit">Adicionar item</button>
        </form>
        <p id="aviso" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>

  <script>
    const token = new URLSearchParams(location.hash.slice(1)).get("t");

    async function api(url, corpo) {
      const resposta = await fetch(url, {
        method: corpo ? "POST" : "GET",
        headers: {"X-Token": token || "", ...(corpo ? {"Content-Type": "application/json"} : {})},
        body: corpo ? JSON.stringify(corpo) : undefined,
      });
      const dados = await resposta.json();
      if (!resposta.ok) throw new Error(dados.detail || "Não foi possível concluir a operação.");
      return dados;
    }

    function avisar(texto) {
      document.getElementById("aviso").textContent = texto;
    }

    function botao(texto, aoClicar) {
      const elemento = document.createElement("button");
      elemento.type = "button";
      elemento.className = texto === "Acabou" ? "botao botao-remover" : "botao botao-secundario";
      elemento.textContent = texto;
      elemento.onclick = aoClicar;
      return elemento;
    }

    async function carregar() {
      const lista = document.getElementById("lista");
      lista.replaceChildren();
      try {
        const itens = await api("/api/despensa");
        if (!itens.length) {
          const linha = lista.insertRow();
          const celula = linha.insertCell();
          celula.colSpan = 3;
          celula.className = "vazio";
          celula.textContent = "Sua despensa ainda está vazia.";
          return;
        }
        for (const item of itens) {
          const linha = lista.insertRow();
          linha.insertCell().textContent = item.nome;
          linha.insertCell().textContent = `${item.quantidade} ${item.unidade || ""}`.trim();
          const acoes = linha.insertCell();
          acoes.className = "acoes";
          acoes.append(
            botao("-1", () => consumir(item.id, "1")),
            botao("-0,5", () => consumir(item.id, "0.5")),
            botao("Acabou", () => consumir(item.id, "TUDO")),
          );
        }
      } catch (erro) {
        avisar(erro.message);
      }
    }

    async function consumir(itemId, quantidade) {
      try {
        avisar((await api("/api/consumir", {item_id: itemId, quantidade})).mensagem);
        await carregar();
      } catch (erro) { avisar(erro.message); }
    }

    document.getElementById("form-adicionar").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      try {
        const resposta = await api("/api/adicionar", {
          nome: document.getElementById("nome").value,
          quantidade: Number(document.getElementById("qtd").value),
          unidade: document.getElementById("un").value,
          categoria: document.getElementById("cat").value,
        });
        avisar(resposta.mensagem);
        document.getElementById("nome").value = "";
        await carregar();
      } catch (erro) { avisar(erro.message); }
    });

    carregar();
  </script>
</body>
</html>
